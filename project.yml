name: PDFSignatureAssistant
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
targets:
  PDFSignatureAssistant:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - target: PDFShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pdfsignatureassistant
        INFOPLIST_KEY_CFBundleDisplayName: PDF签名助手
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
  PDFShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pdfsignatureassistant.share
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
